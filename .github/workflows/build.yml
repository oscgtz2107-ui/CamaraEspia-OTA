name: Build & Release

on:
  repository_dispatch:
    types: [build]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty for auto)'
        required: false
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: oscgtz2107-ui/CamaraEspia
          ref: main
          token: ${{ secrets.OTA_TOKEN }}
          path: source

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.client_payload.version }}" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep -oP '#define FIRMWARE_VERSION\s*"\K[^"]+' source/firmware/src/config.h 2>/dev/null || echo "1.0.0")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
          echo "sha=${{ github.event.client_payload.sha || github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: source/android
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: source/android/app/build/outputs/apk/debug/app-debug.apk

  build-firmware:
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: oscgtz2107-ui/CamaraEspia
          ref: main
          token: ${{ secrets.OTA_TOKEN }}

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.client_payload.version }}" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep -oP '#define FIRMWARE_VERSION\s*"\K[^"]+' firmware/src/config.h 2>/dev/null || echo "1.0.0")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
          echo "sha=${{ github.event.client_payload.sha || github.sha }}" >> $GITHUB_OUTPUT

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk/

      - name: Convert APK to C header
        run: |
          python3 tools/bin2header.py apk/app-debug.apk firmware/src/embedded_apk.h EMBEDDED_APK
          APK_SIZE=$(stat -c%s apk/app-debug.apk)
          echo "[build] Embedded APK: ${APK_SIZE} bytes"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        working-directory: firmware
        run: pio run

      - name: Collect firmware artifacts
        run: |
          mkdir -p release
          cp firmware/.pio/build/esp32s3/firmware.bin release/CamaraEspia-v${{ steps.version.outputs.version }}.bin
          cp firmware/.pio/build/esp32s3/bootloader.bin release/bootloader.bin
          cp firmware/.pio/build/esp32s3/partitions.bin release/partitions.bin
          
          # Create combined flash image
          python3 -c "
          with open('release/firmware_flash.bin', 'wb') as out:
              with open('release/bootloader.bin', 'rb') as f: out.write(f.read())
              out.write(b'\x00' * (0x8000 - out.tell()))
              with open('release/partitions.bin', 'rb') as f: out.write(f.read())
              out.write(b'\x00' * (0x10000 - out.tell()))
              with open('release/CamaraEspia-v${{ steps.version.outputs.version }}.bin', 'rb') as f: out.write(f.read())
          "
          
          sha256sum release/CamaraEspia-v${{ steps.version.outputs.version }}.bin > release/firmware.sha256

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: release/

  release:
    needs: [build-apk, build-firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout OTA repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware-release/

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk-release/

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.client_payload.version }}" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=1.0.0" >> $GITHUB_OUTPUT
          fi
          echo "sha=${{ github.event.client_payload.sha || github.sha }}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: cp apk-release/app-debug.apk apk-release/CamaraEspia-v${{ steps.version.outputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CamaraEspia v${{ steps.version.outputs.version }}
          body: |
            ## CamaraEspia v${{ steps.version.outputs.version }}
            
            **Commit:** ${{ steps.version.outputs.sha }}
            
            ### Firmware
            - `CamaraEspia-v${{ steps.version.outputs.version }}.bin` — Firmware para flash directo
            - `firmware_flash.bin` — Imagen completa (bootloader + partitions + firmware)
            - `firmware.sha256` — Hash SHA256 para verificación OTA
            
            ### App Android
            - `CamaraEspia-v${{ steps.version.outputs.version }}.apk` — App Android
          files: |
            firmware-release/CamaraEspia-v${{ steps.version.outputs.version }}.bin
            firmware-release/firmware_flash.bin
            firmware-release/firmware.sha256
            firmware-release/bootloader.bin
            firmware-release/partitions.bin
            apk-release/CamaraEspia-v${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy version.json to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          git checkout gh-pages || git checkout --orphan gh-pages
          git clean -fd
          cat > version.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "sha": "${{ steps.version.outputs.sha }}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "firmware_url": "https://github.com/oscgtz2107-ui/CamaraEspia-OTA/releases/download/v${{ steps.version.outputs.version }}/CamaraEspia-v${{ steps.version.outputs.version }}.bin",
            "sha256_url": "https://github.com/oscgtz2107-ui/CamaraEspia-OTA/releases/download/v${{ steps.version.outputs.version }}/firmware.sha256",
            "apk_url": "https://github.com/oscgtz2107-ui/CamaraEspia-OTA/releases/download/v${{ steps.version.outputs.version }}/CamaraEspia-v${{ steps.version.outputs.version }}.apk"
          }
          EOF
          git add version.json
          git commit -m "Update version.json to v${{ steps.version.outputs.version }}" || true
          git push origin gh-pages
