name: Build & Release

# Publica una release completa (firmware + APK) y actualiza version.json, que
# es lo que consultan tanto las camaras (OTA de firmware) como la app Android.
#
# Se dispara solo: el repo privado manda un repository_dispatch en cada push a
# main que toque firmware/ o android/. Tambien se puede lanzar a mano.

on:
  repository_dispatch:
    types: [build]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (vacio = leer FIRMWARE_VERSION de config.h)'
        required: false
        default: ''

concurrency:
  # Dos releases a la vez pelearian por el mismo tag y por la rama gh-pages.
  group: release
  cancel-in-progress: false

env:
  SOURCE_REPO: oscgtz2107-ui/CamaraEspia

jobs:
  # ---------------------------------------------------------------
  # Version unica para todos los jobs: sin esto cada uno la calculaba
  # por su cuenta y podian discrepar.
  # ---------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - name: Checkout source (privado)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: main
          token: ${{ secrets.OTA_TOKEN }}

      - name: Resolver version
        id: v
        run: |
          set -euo pipefail
          IN="${{ github.event.inputs.version || github.event.client_payload.version || '' }}"
          if [ -n "$IN" ]; then
            VERSION="$IN"
          else
            VERSION=$(grep -oP '#define\s+FIRMWARE_VERSION\s+"\K[^"]+' firmware/src/config.h)
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::No se pudo determinar la version desde config.h"; exit 1
          fi
          # versionCode debe crecer SIEMPRE o Android rechaza la actualizacion.
          # Derivarlo de la version (X*10000+Y*100+Z) lo hace monotono y estable.
          CODE=$(echo "$VERSION" | awk -F. '{printf "%d", ($1*10000)+($2*100)+$3}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE"       >> $GITHUB_OUTPUT
          echo "sha=${{ github.event.client_payload.sha || github.sha }}" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (versionCode $CODE)"

  # ---------------------------------------------------------------
  build-firmware:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (privado)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: main
          token: ${{ secrets.OTA_TOKEN }}

      - name: Generar secrets.h
        # secrets.h esta gitignored (no debe versionarse), asi que en CI hay que
        # recrearlo. Sin este paso el firmware publicado saldria con Telegram
        # deshabilitado, en silencio.
        run: |
          cat > firmware/src/secrets.h << 'EOF'
          #ifndef SECRETS_H
          #define SECRETS_H
          #define TG_BOT_TOKEN   "${{ secrets.TG_BOT_TOKEN }}"
          #define WIFI_AP_PASS   "${{ secrets.WIFI_AP_PASS }}"
          #endif
          EOF
          if [ -z "${{ secrets.TG_BOT_TOKEN }}" ]; then
            echo "::warning::TG_BOT_TOKEN vacio: el firmware saldra sin Telegram"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Instalar PlatformIO
        run: pip install --upgrade platformio

      - name: Compilar firmware
        working-directory: firmware
        # -e esp32s3 explicito: sin el, `pio run` compila TODOS los entornos,
        # incluido el de banco (esp32s3-bench), que lleva un volumen de
        # pruebas en flash y endpoints sin autenticacion. Nunca debe salir
        # publicado, y ademas compilarlo duplica el tiempo de build.
        run: pio run -e esp32s3

      - name: Empaquetar artefactos
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          B=firmware/.pio/build/esp32s3
          mkdir -p release
          cp "$B/firmware.bin"   "release/CamaraEspia-v$V.bin"
          cp "$B/bootloader.bin" release/bootloader.bin
          cp "$B/partitions.bin" release/partitions.bin

          # Imagen unica para flasheo de fabrica (bootloader + tabla + app).
          # Offsets del ESP32-S3: bootloader 0x0, particiones 0x8000, app 0x10000.
          python3 - << PY
          import io
          out = io.BytesIO()
          def put(path, off):
              out.write(b'\xff' * (off - out.tell()))
              out.write(open(path,'rb').read())
          put('release/bootloader.bin', 0x0000)
          put('release/partitions.bin', 0x8000)
          put('release/CamaraEspia-v$V.bin', 0x10000)
          open('release/firmware_flash.bin','wb').write(out.getvalue())
          PY

          # Hash del binario OTA (no de la imagen completa).
          ( cd release && sha256sum "CamaraEspia-v$V.bin" > firmware.sha256 )
          ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: release/

  # ---------------------------------------------------------------
  build-apk:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (privado)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: main
          token: ${{ secrets.OTA_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
        with:
          # Fijar la version que YA trae el runner. Por defecto la action busca
          # una mas nueva y la descarga de dl.google.com; Google retira esas
          # URLs sin aviso y el build empieza a fallar con un 404 sin que nada
          # haya cambiado por nuestra parte.
          cmdline-tools-version: '12.0'
      - uses: gradle/actions/setup-gradle@v4

      - name: Restaurar keystore de firma
        # CRITICO: la clave debe ser SIEMPRE la misma. Si se genera una nueva en
        # cada build, Android rechaza instalar la actualizacion sobre la version
        # anterior por firma distinta, y el auto-update queda roto.
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KS_B64" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64."
            echo "Genera el keystore UNA vez y guardalo (ver README del repo OTA)."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android/app/release.keystore
          echo "Keystore restaurado ($(stat -c%s android/app/release.keystore) bytes)"

      - name: Compilar APK release
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName=${{ needs.version.outputs.version }} \
            -PappVersionCode=${{ needs.version.outputs.code }}

      - name: Recoger APK
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          APK=android/app/build/outputs/apk/release/app-release.apk
          # Sin fallback a debug: publicar un APK de debug como release seria
          # peor que fallar, porque pasaria desapercibido.
          if [ ! -f "$APK" ]; then
            echo "::error::No se genero el APK firmado ($APK)"
            find android/app/build/outputs/apk -name '*.apk' -print || true
            exit 1
          fi
          mkdir -p apk && cp "$APK" "apk/CamaraEspia-v$V.apk"

          # Comprobar que la version incrustada es la esperada.
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          "$AAPT" dump badging "apk/CamaraEspia-v$V.apk" | grep -E "versionName|versionCode" || true

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk/

  # ---------------------------------------------------------------
  release:
    needs: [version, build-firmware, build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: firmware, path: firmware-release/ }
      - uses: actions/download-artifact@v4
        with: { name: apk, path: apk-release/ }

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: CamaraEspia v${{ needs.version.outputs.version }}
          body: |
            ## CamaraEspia v${{ needs.version.outputs.version }}

            **Commit:** `${{ needs.version.outputs.sha }}`

            ### Firmware (ESP32-S3)
            | Archivo | Uso |
            |---|---|
            | `CamaraEspia-v${{ needs.version.outputs.version }}.bin` | Actualizacion OTA |
            | `firmware_flash.bin` | Flasheo de fabrica a `0x0` (bootloader + tabla + app) |
            | `firmware.sha256` | Verificacion del binario OTA |

            ### App Android
            `CamaraEspia-v${{ needs.version.outputs.version }}.apk` — firmada con la
            clave de release (actualizable sobre versiones anteriores).
          files: |
            firmware-release/CamaraEspia-v${{ needs.version.outputs.version }}.bin
            firmware-release/firmware_flash.bin
            firmware-release/firmware.sha256
            firmware-release/bootloader.bin
            firmware-release/partitions.bin
            apk-release/CamaraEspia-v${{ needs.version.outputs.version }}.apk
          draft: false
          prerelease: false

      - name: Publicar version.json y landing page en GitHub Pages
        # Es el unico endpoint que consultan camaras y app; se escribe DESPUES de
        # la release para que las URLs que anuncia ya existan.
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/v$V"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages && git checkout gh-pages || git checkout --orphan gh-pages
          git rm -rf --cached . >/dev/null 2>&1 || true
          git clean -fdx

          cat > version.json << EOF
          {
            "version": "$V",
            "sha": "${{ needs.version.outputs.sha }}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "firmware_url": "$BASE/CamaraEspia-v$V.bin",
            "sha256_url": "$BASE/firmware.sha256",
            "apk_url": "$BASE/CamaraEspia-v$V.apk"
          }
          EOF
          # Landing page de descarga. Se REGENERA en cada release: la anterior
          # tenia la version y la URL del APK escritas a mano, asi que se quedo
          # anclada en v1.2.0 y ofrecia un APK viejo para siempre.
          cat > index.html << HTML
          <!DOCTYPE html>
          <html lang="es">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>CamaraEspia - Descargar</title>
          <style>
          *{margin:0;padding:0;box-sizing:border-box}
          body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
          .card{background:#1e293b;border-radius:16px;padding:40px;max-width:480px;width:100%;box-shadow:0 25px 50px rgba(0,0,0,.5)}
          h1{font-size:1.8rem;margin-bottom:8px;color:#f1f5f9}
          .sub{color:#94a3b8;margin-bottom:24px;font-size:.95rem}
          .version{display:inline-block;background:#334155;padding:4px 12px;border-radius:20px;font-size:.85rem;color:#94a3b8;margin-bottom:24px}
          .download{display:block;background:#2563eb;color:#fff;text-decoration:none;padding:16px 24px;border-radius:12px;text-align:center;transition:background .2s}
          .download:hover{background:#1d4ed8}
          .download span{font-size:.8rem;color:rgba(255,255,255,.7);display:block;margin-top:4px}
          .fw{display:block;margin-top:12px;background:#334155;color:#e2e8f0;text-decoration:none;padding:12px 24px;border-radius:12px;text-align:center;font-size:.9rem;transition:background .2s}
          .fw:hover{background:#475569}
          .note{margin-top:24px;padding:16px;background:#334155;border-radius:8px;font-size:.85rem;color:#94a3b8;line-height:1.6}
          .note strong{color:#e2e8f0}
          .foot{margin-top:20px;font-size:.75rem;color:#64748b;text-align:center}
          .foot a{color:#64748b}
          </style>
          </head>
          <body>
          <div class="card">
          <h1>CamaraEspia</h1>
          <p class="sub">Sistema de seguridad ESP32-S3</p>
          <div class="version">v$V &middot; $(date -u +%d/%m/%Y)</div>
          <a class="download" href="$BASE/CamaraEspia-v$V.apk">
          Descargar app Android
          <span>CamaraEspia-v$V.apk</span>
          </a>
          <a class="fw" href="$BASE/firmware_flash.bin">Firmware para flashear (.bin)</a>
          <div class="note">
          <strong>Instalar la app:</strong> descarga el APK y abrelo. Android pedira
          permiso para instalar desde esta fuente.<br><br>
          <strong>Si ya tienes la app:</strong> te avisa sola y se actualiza en
          segundo plano; no hace falta volver aqui.
          </div>
          <p class="foot"><a href="version.json">version.json</a> &middot; <a href="https://github.com/${{ github.repository }}/releases">todas las versiones</a></p>
          </div>
          </body>
          </html>
          HTML

          touch .nojekyll
          git add version.json index.html .nojekyll
          git commit -m "Release v$V" || echo "sin cambios"
          git push origin gh-pages
